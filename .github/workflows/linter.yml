name: Lint codebase
"on":
  push:
    branches: [main, develop]
    tags-ignore: ["**"]
  pull_request:
  workflow_call:
jobs:
  lint:
    name: Run pre-commit
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    steps:
      - name: Checkout code (PR)
        if: ${{ github.event_name == 'pull_request' }}
        uses: actions/checkout@v7
        with:
          # Infinite depth (without retrieving unrelated branches) – search
          # <https://git-scm.com/docs/shallow> for this magic number...
          fetch-depth: 2147483647
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Checkout code
        if: ${{ github.event_name != 'pull_request' }}
        uses: actions/checkout@v7
      - name: Restore cached dependencies
        id: cache-restore
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/.cache/pre-commit
            ~/.cache/pip
            ~/.npm
            ~/.local/bin
            ~/.cache/go-build
            ~/go/pkg/mod
            ~/go/bin
          key: "pre-commit-cache-\
            ${{ hashFiles('.pre-commit-config.yaml', '.github/scripts/setup-pre-commit.sh') }}"
      - name: Setup PATH
        run: |
          mkdir -p "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.24"
          cache: false
      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.10"
      - name: Install dependencies
        env:
          USE_PIPX: false
        run: .github/scripts/setup-pre-commit.sh
      - name: Run pre-commit (PR)
        if: ${{ github.event_name == 'pull_request' }}
        run: |
          pre-commit run --color=always \
            --from-ref ${{ github.event.pull_request.base.sha }} \
            --to-ref HEAD
        env:
          GH_ACTION_OUTPUT: true
      - name: Run pre-commit
        if: ${{ github.event_name != 'pull_request' }}
        run: pre-commit run --color=always --all-files
        env:
          GH_ACTION_OUTPUT: true
      - name: Cache dependencies
        uses: actions/cache/save@v6
        if: always()
        with:
          path: |
            ~/.cache/pre-commit
            ~/.cache/pip
            ~/.npm
            ~/.local/bin
            ~/.cache/go-build
            ~/go/pkg/mod
            ~/go/bin
          key: ${{ steps.cache-restore.outputs.cache-primary-key }}
